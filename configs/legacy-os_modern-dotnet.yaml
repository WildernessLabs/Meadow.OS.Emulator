# Meadow.OS Emulator Configuration — Legacy OS + .NET 10 Mono Runtime
#
# This config targets the legacy NuttX-based Meadow OS firmware linked with
# the new .NET 10 Mono runtime (interpreter-only, CMake-built from runtime/).
#
# The NuttX firmware comes from Meadow/ (legacy NuttX codebase), while the
# Mono runtime is the .NET 10 fork built via runtime/src/mono/build-nuttx.sh.
#
# Copy to emulator.config.yaml at repo root, or pass via:
#   ./run.sh --config configs/legacy-os_modern-dotnet.yaml

# Which OS variant to build and run
os: legacy

# Board to emulate
board: F7FeatherV2

# ESP32 coprocessor mode
#   stub         — EspcpStub (fast, no real ESP32 needed)
#   dual-machine — Real ESP32 firmware on emulated Xtensa (requires Meadow-ESP32 build)
coprocessor: stub

# Build configuration
build:
  # NuttX defconfig name (subdirectory under stm32f777zit6-meadow/)
  defconfig: mono

  # Mono/.NET runtime to link into the firmware
  #   (empty)                  — no mono runtime (NuttX only)
  #   legacy-os_modern-dotnet  — .NET 10 Mono (CMake, from runtime/src/mono/)
  runtime: legacy-os_modern-dotnet

# Network ports
ports:
  hcom: 4242        # HCOM TCP socket (Meadow.CLI connects here)
  monitor: 1234     # Renode monitor telnet
  esp32ctrl: 4243   # ESP32 UART control channel
  gdb: 0            # GDB server port (0 = disabled)

# Debug options
debug:
  console_log: /tmp/renode-uart-dotnet10.txt
  headless: true    # true = no GUI analyzer windows
