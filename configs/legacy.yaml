# Meadow.OS Emulator Configuration — Legacy OS
#
# This config targets the legacy NuttX-based Meadow OS (production firmware).
# Copy to emulator.config.yaml at repo root, or pass via: ./run.sh --config configs/legacy.yaml

# Which OS variant to build and run
os: legacy
# os: meadow-os

# Board to emulate
board: F7FeatherV2
# board: F7CoreComputeV2

# ESP32 coprocessor mode
#   stub         — EspcpStub (fast, no real ESP32 needed)
#   dual-machine — Real ESP32 firmware on emulated Xtensa (requires Meadow-ESP32 build)
#   esp-emu      — Real firmware (ESP32-S3 build) in Espressif's esp-emu (Legacy only;
#                  build.sh --emulator in Meadow-ESP32, esp-emu 1.2.0+)
coprocessor: stub
# coprocessor: dual-machine

# Build configuration
build:
  # NuttX defconfig name (subdirectory under stm32f777zit6-meadow/)
  defconfig: mono

# Network ports
ports:
  hcom: 4242        # HCOM TCP socket (Meadow.CLI connects here)
  monitor: 1234     # Renode monitor telnet
  esp32ctrl: 4243   # ESP32 UART control channel
  gdb: 0            # GDB server port (0 = disabled)

# Debug options
debug:
  console_log: /tmp/renode-uart-legacy.txt
  headless: true    # true = no GUI analyzer windows
